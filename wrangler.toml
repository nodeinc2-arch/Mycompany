name = "node2-site"
main = ".open-next/worker.js"
compatibility_date = "2026-06-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
# Exposes /labs/* (incl. /labs/payroll) in production. Required for the Pay.ca
# product link in the homepage finance section to resolve instead of 404.
LABS_ENABLED = "1"

# Base URL for absolute links built server-side (Stripe checkout success/cancel
# URLs); page metadata and the sitemap already default to this host in code.
NEXT_PUBLIC_SITE_URL = "https://www.node2.io"

# Durable, relational store for Pay.ca (audit log, billing entitlement,
# tenants) — see docs/d1-setup.md. Migrations live in migrations/ and are
# applied with pnpm db:migrate (local) / pnpm db:migrate:remote (deployed DB).
[[d1_databases]]
binding = "PAYCA_DB"
database_name = "payca"
database_id = "de0a6b19-aca7-491f-a043-3314bb9fe8f6"

[[routes]]
pattern = "www.node2.io"
zone_name = "node2.io"
custom_domain = true

[[routes]]
pattern = "node2.io"
zone_name = "node2.io"
custom_domain = true